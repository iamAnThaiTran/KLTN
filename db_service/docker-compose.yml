version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: product_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    ports:
      - "15432:5432"  # Use high port to avoid Windows reserved range
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/backups:/backups
    networks:
      - db_network
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: product_redis 
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - db_network
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: product_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management console
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # Microservices
  # ============================================================================

  product-service:
    build:
      context: ../BackendPython/services/product_service
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
    ports:
      - "8001:8001"
    volumes:
      - ../BackendPython/services/product_service:/app
    depends_on:
      postgres:
        condition: service_started
    networks:
      - db_network
    restart: unless-stopped

  recommender-service:
    build:
      context: ../BackendPython/services/recommender_service
      dockerfile: Dockerfile
    container_name: recommender-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
    ports:
      - "8002:8002"
    volumes:
      - ../BackendPython/services/recommender_service:/app
    depends_on:
      postgres:
        condition: service_started
    networks:
      - db_network
    restart: unless-stopped

  crawl-service:
    build:
      context: ../BackendPython/services/crawl_service
      dockerfile: Dockerfile
    container_name: crawl-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8003:8003"
    volumes:
      - ../BackendPython/services/crawl_service:/app
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - db_network
    restart: unless-stopped

  user-service:
    build:
      context: ../BackendPython/services/user_service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
    ports:
      - "8004:8004"
    volumes:
      - ../BackendPython/services/user_service:/app
    depends_on:
      postgres:
        condition: service_started
    networks:
      - db_network
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  # pgadmin_data:
  #   driver: local

networks:
  db_network:
    driver: bridge