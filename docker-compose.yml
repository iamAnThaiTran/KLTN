services:
  postgres:
    image: postgres:15-alpine
    container_name: product_postgres
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: your_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    ports:
      - "15432:5432"  # Use high port to avoid Windows reserved range
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_service/postgres/init:/docker-entrypoint-initdb.d
      - ./db_service/postgres/backups:/backups
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: product_redis 
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./db_service/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: product_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management console
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # Microservices
  # ============================================================================

  product-service:
    build:
      context: ./services/product_service
      dockerfile: Dockerfile
    container_name: product-service
    env_file:
      - ./services/product_service/.env
    ports:
      - "8001:8001"
    volumes:
      - ./services/product_service:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_network
    restart: unless-stopped

  recommender-service:
    build:
      context: ./services/recommender_service
      dockerfile: Dockerfile
    container_name: recommender-service
    env_file:
      - ./services/recommender_service/.env
    ports:
      - "8002:8002"
    volumes:
      - ./services/recommender_service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      crawl-service:
        condition: service_healthy
    networks:
      - db_network
    restart: unless-stopped

  crawl-service:
    build:
      context: ./services/crawl_service
      dockerfile: Dockerfile
    container_name: crawl-service
    env_file:
      - ./services/crawl_service/.env
    ports:
      - "8003:8003"
    volumes:
      - ./services/crawl_service:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - db_network
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:8003/api/health || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 30s
    restart: unless-stopped

  crawl-worker:
    build:
      context: ./services/crawl_service
      dockerfile: Dockerfile.worker
    container_name: crawl-worker
    env_file:
      - ./services/crawl_service/.env
    volumes:
      - ./services/crawl_service:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - db_network
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user_service
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
      - ./services/user_service/.env
    ports:
      - "8004:8000"
    volumes:
      - ./services/user_service:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_network
    restart: unless-stopped

  # ============================================================================
  # API Gateway (Single Entry Point)
  # ============================================================================

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:80"  # Single entry point for all APIs
    volumes:
      - ./api_gateway/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-service
      - recommender-service
      - crawl-service
      - user-service
    networks:
      - db_network
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  db_network:
    driver: bridge
